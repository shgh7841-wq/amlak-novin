<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت درخواست ملک | مشاور املاک نوین</title>

<style>
:root {
  --bg:#07111f;--card:#101e30;--text:#f2f7ff;
  --muted:#a8bad0;--accent:#00f5d4;--accent2:#9b5cff;
  --border:#263b54;
}
body.light {
  --bg:#f2f7fc;--card:#fff;--text:#13243a;
  --muted:#61738a;--accent:#008f83;--accent2:#7442d9;
  --border:#d7e2ee;
}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);transition:.3s}
header{padding:20px 7%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;background:var(--card);border-bottom:1px solid var(--border)}
.logo{font-size:23px;font-weight:bold;color:var(--accent);text-shadow:0 0 12px var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a,.theme{padding:10px 14px;border:1px solid var(--border);border-radius:10px;color:var(--text);text-decoration:none;background:transparent;font-family:inherit;cursor:pointer}
nav a:hover,.theme:hover{border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
main{max-width:850px;margin:45px auto;padding:0 18px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 0 25px #00f5d410}
h1{text-align:center;color:var(--accent);margin-top:0}
.intro{text-align:center;color:var(--muted);line-height:2}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
label{display:block;margin:18px 0 8px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;font-size:15px}
textarea{min-height:110px;resize:vertical}
.full{grid-column:1/-1}
button.submit{width:100%;padding:14px;margin-top:22px;background:var(--accent);color:#07111f;border:0;border-radius:10px;font-family:inherit;font-size:16px;font-weight:bold;cursor:pointer}
.message{display:none;margin-top:18px;padding:13px;border-radius:10px;background:#008f8330;line-height:1.8}
footer{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:600px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>

<body>
<header>
  <div class="logo" data-fa="نوین املاک" data-en="NOVIN REAL ESTATE">نوین املاک</div>
  <nav>
    <a href="index.html" data-fa="صفحه اصلی" data-en="Home">صفحه اصلی</a>
    <a href="survey.html" data-fa="نظرسنجی" data-en="Survey">نظرسنجی</a>
    <a href="request.html" data-fa="ثبت درخواست" data-en="Request">ثبت درخواست</a>
  </nav>
  <div>
    <button class="theme" onclick="toggleTheme()" data-fa="تغییر تم" data-en="Theme">تغییر تم</button>
    <button class="theme" onclick="toggleLanguage()" id="langBtn">English</button>
  </div>
</header>

<main>
  <div class="panel">
    <h1 data-fa="ثبت درخواست ملک" data-en="Property Request">ثبت درخواست ملک</h1>
    <p class="intro" data-fa="اطلاعات موردنیاز را وارد کنید."
       data-en="Please fill in the required information.">
      اطلاعات موردنیاز را وارد کنید.
    </p>

    <form id="requestForm">
      <div class="formgrid">
        <div>
          <label for="name" data-fa="نام و نام خانوادگی" data-en="Full Name">نام و نام خانوادگی</label>
          <input id="name" name="name" required autocomplete="name">
        </div>

        <div>
          <label for="phone" data-fa="شماره تماس" data-en="Phone Number">شماره تماس</label>
          <input id="phone" name="phone" type="tel" required autocomplete="tel">
        </div>

        <div>
          <label for="transaction" data-fa="نوع معامله" data-en="Transaction Type">نوع معامله</label>
          <select id="transaction" name="transaction" required>
            <option value="" data-fa="انتخاب کنید" data-en="Select">انتخاب کنید</option>
            <option value="buy" data-fa="خرید" data-en="Buy">خرید</option>
            <option value="sell" data-fa="فروش" data-en="Sell">فروش</option>
            <option value="mortgage" data-fa="رهن" data-en="Mortgage">رهن</option>
            <option value="rent" data-fa="اجاره" data-en="Rent">اجاره</option>
          </select>
        </div>

        <div>
          <label for="property" data-fa="نوع ملک" data-en="Property Type">نوع ملک</label>
          <select id="property" name="property" required>
            <option value="" data-fa="انتخاب کنید" data-en="Select">انتخاب کنید</option>
            <option value="villa" data-fa="ویلا" data-en="Villa">ویلا</option>
            <option value="garden" data-fa="باغ" data-en="Garden">باغ</option>
            <option value="apartment" data-fa="آپارتمان" data-en="Apartment">آپارتمان</option>
            <option value="land" data-fa="زمین" data-en="Land">زمین</option>
            <option value="other" data-fa="سایر" data-en="Other">سایر</option>
          </select>
        </div>

        <div>
          <label for="city" data-fa="شهر یا منطقه" data-en="City or Area">شهر یا منطقه</label>
          <input id="city" name="city" required>
        </div>

        <div>
          <label for="budget" data-fa="بودجه یا مبلغ پیشنهادی" data-en="Budget or Asking Price">بودجه یا مبلغ پیشنهادی</label>
          <input id="budget" name="budget">
        </div>

        <div class="full">
          <label for="details" data-fa="توضیحات تکمیلی" data-en="Additional Details">توضیحات تکمیلی</label>
          <textarea id="details" name="details"></textarea>
        </div>
      </div>

      <button type="submit" class="submit" data-fa="ثبت درخواست" data-en="Submit Request">ثبت درخواست</button>
      <div id="message" class="message"></div>
    </form>
  </div>
</main>

<footer data-fa="مشاور املاک نوین" data-en="Novin Real Estate">مشاور املاک نوین</footer>

<script>
function toggleTheme(){
  document.body.classList.toggle('light');
  localStorage.setItem('novin-theme',document.body.classList.contains('light')?'light':'dark');
}
if(localStorage.getItem('novin-theme')==='light')document.body.classList.add('light');

function toggleLanguage(){
  const en=document.documentElement.lang==='fa';
  document.documentElement.lang=en?'en':'fa';
  document.documentElement.dir=en?'ltr':'rtl';
  document.querySelectorAll('[data-fa]').forEach(el=>{
    el.innerHTML=en?el.dataset.en:el.dataset.fa;
  });
  document.getElementById('langBtn').textContent=en?'فارسی':'English';
}

const params=new URLSearchParams(location.search);
if(params.has('transaction'))document.getElementById('transaction').value=params.get('transaction');
if(params.has('property'))document.getElementById('property').value=params.get('property');

document.getElementById('requestForm').addEventListener('submit',function(e){
  e.preventDefault();
  const data={
    name:document.getElementById('name').value,
    phone:document.getElementById('phone').value,
    transaction:document.getElementById('transaction').value,
    property:document.getElementById('property').value,
    city:document.getElementById('city').value,
    budget:document.getElementById('budget').value,
    details:document.getElementById('details').value,
    date:new Date().toISOString()
  };

  const records=JSON.parse(localStorage.getItem('novin-requests')||'[]');
  records.push(data);
  localStorage.setItem('novin-requests',JSON.stringify(records));

  const msg=document.getElementById('message');
  msg.style.display='block';
  msg.textContent=document.documentElement.lang==='fa'
    ?'درخواست در همین مرورگر ذخیره شد. برای دریافت درخواست‌ها از طرف مشتریان در دستگاه‌های دیگر، اتصال به سرور لازم است.'
    :'Request saved in this browser. Server integration is needed to receive requests from customers on other devices.';
  this.reset();
});
</script>
</body>
</html>
