<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظرسنجی | مشاور املاک نوین</title>

<style>
:root {
  --bg:#07111f;--card:#101e30;--text:#f2f7ff;
  --muted:#a8bad0;--accent:#00f5d4;--accent2:#9b5cff;
  --border:#263b54;
}
body.light {
  --bg:#f2f7fc;--card:#fff;--text:#13243a;
  --muted:#61738a;--accent:#008f83;--accent2:#7442d9;
  --border:#d7e2ee;
}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);transition:.3s}
header{padding:20px 7%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;background:var(--card);border-bottom:1px solid var(--border)}
.logo{font-size:23px;font-weight:bold;color:var(--accent);text-shadow:0 0 12px var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a,.theme{padding:10px 14px;border:1px solid var(--border);border-radius:10px;color:var(--text);text-decoration:none;background:transparent;font-family:inherit;cursor:pointer}
nav a:hover,.theme:hover{border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
main{max-width:760px;margin:45px auto;padding:0 18px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 0 25px #00f5d410}
h1{text-align:center;color:var(--accent);margin-top:0}
.intro{text-align:center;color:var(--muted);line-height:2}
label{display:block;margin:20px 0 8px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;font-size:15px}
textarea{min-height:110px;resize:vertical}
button.submit{width:100%;padding:14px;margin-top:22px;background:var(--accent);color:#07111f;border:0;border-radius:10px;font-family:inherit;font-size:16px;font-weight:bold;cursor:pointer}
.message{display:none;margin-top:18px;padding:13px;border-radius:10px;background:#008f8330;line-height:1.8}
footer{text-align:center;padding:25px;color:var(--muted)}
</style>
</head>

<body>
<header>
  <div class="logo" data-fa="نوین املاک" data-en="NOVIN REAL ESTATE">نوین املاک</div>
  <nav>
    <a href="index.html" data-fa="صفحه اصلی" data-en="Home">صفحه اصلی</a>
    <a href="survey.html" data-fa="نظرسنجی" data-en="Survey">نظرسنجی</a>
    <a href="request.html" data-fa="ثبت درخواست" data-en="Request">ثبت درخواست</a>
  </nav>
  <div>
    <button class="theme" onclick="toggleTheme()" data-fa="تغییر تم" data-en="Theme">تغییر تم</button>
    <button class="theme" onclick="toggleLanguage()" id="langBtn">English</button>
  </div>
</header>

<main>
  <div class="panel">
    <h1 data-fa="نظرسنجی مشتریان" data-en="Customer Survey">نظرسنجی مشتریان</h1>
    <p class="intro" data-fa="نظر شما به بهبود خدمات مشاور املاک نوین کمک می‌کند."
       data-en="Your feedback helps us improve Novin Real Estate services.">
      نظر شما به بهبود خدمات مشاور املاک نوین کمک می‌کند.
    </p>

    <form id="surveyForm">
      <label for="name" data-fa="نام (اختیاری)" data-en="Name (optional)">نام (اختیاری)</label>
      <input id="name" name="name" autocomplete="name">

      <label for="rating" data-fa="رضایت شما از خدمات" data-en="Your satisfaction">رضایت شما از خدمات</label>
      <select id="rating" name="rating" required>
        <option value="" data-fa="انتخاب کنید" data-en="Select">انتخاب کنید</option>
        <option value="5" data-fa="عالی" data-en="Excellent">عالی</option>
        <option value="4" data-fa="خوب" data-en="Good">خوب</option>
        <option value="3" data-fa="متوسط" data-en="Average">متوسط</option>
        <option value="2" data-fa="ضعیف" data-en="Poor">ضعیف</option>
        <option value="1" data-fa="بسیار ضعیف" data-en="Very poor">بسیار ضعیف</option>
      </select>

      <label for="service" data-fa="کدام خدمت را دریافت کردید؟" data-en="Which service did you use?">کدام خدمت را دریافت کردید؟</label>
      <select id="service" name="service" required>
        <option value="" data-fa="انتخاب کنید" data-en="Select">انتخاب کنید</option>
        <option data-fa="خرید" data-en="Buying">خرید</option>
        <option data-fa="فروش" data-en="Selling">فروش</option>
        <option data-fa="رهن" data-en="Mortgage">رهن</option>
        <option data-fa="اجاره" data-en="Renting">اجاره</option>
      </select>

      <label for="comments" data-fa="پیشنهاد یا نظر شما" data-en="Your comments or suggestions">پیشنهاد یا نظر شما</label>
      <textarea id="comments" name="comments" placeholder="نظر خود را بنویسید..."></textarea>

      <button type="submit" class="submit" data-fa="ثبت نظرسنجی" data-en="Submit Survey">ثبت نظرسنجی</button>
      <div id="message" class="message"></div>
    </form>
  </div>
</main>

<footer data-fa="مشاور املاک نوین" data-en="Novin Real Estate">مشاور املاک نوین</footer>

<script>
function toggleTheme(){
  document.body.classList.toggle('light');
  localStorage.setItem('novin-theme',document.body.classList.contains('light')?'light':'dark');
}
if(localStorage.getItem('novin-theme')==='light')document.body.classList.add('light');

function toggleLanguage(){
  const en=document.documentElement.lang==='fa';
  document.documentElement.lang=en?'en':'fa';
  document.documentElement.dir=en?'ltr':'rtl';
  document.querySelectorAll('[data-fa]').forEach(el=>{
    el.innerHTML=en?el.dataset.en:el.dataset.fa;
  });
  document.getElementById('langBtn').textContent=en?'فارسی':'English';
}

document.getElementById('surveyForm').addEventListener('submit',function(e){
  e.preventDefault();
  const data={
    name:document.getElementById('name').value,
    rating:document.getElementById('rating').value,
    service:document.getElementById('service').value,
    comments:document.getElementById('comments').value,
    date:new Date().toISOString()
  };
  const records=JSON.parse(localStorage.getItem('novin-surveys')||'[]');
  records.push(data);
  localStorage.setItem('novin-surveys',JSON.stringify(records));

  const msg=document.getElementById('message');
  msg.style.display='block';
  msg.textContent=document.documentElement.lang==='fa'
    ?'نظرسنجی در همین مرورگر ذخیره شد. برای ارسال به مدیر سایت، اتصال به سرور لازم است.'
    :'Survey saved in this browser. Server integration is needed to send it to the website owner.';
  this.reset();
});
</script>
</body>
</html>
